services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # The ./data bind mount hides the image's /app/data: this user must own the host folder.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./data:/app/data
    # No published ports: the app is reachable only from cloudflared on the compose network.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    # Pinned release (checked on Docker Hub, 2026-11-10). Bump it deliberately, never use `latest`.
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
